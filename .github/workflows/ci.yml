name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py skills/deepseek-delegation/scripts/*.py
      - name: Validate release assets (model JSON, provider TOML, rendered agent TOML, skill format)
        run: python3 tests/test_release_assets.py
